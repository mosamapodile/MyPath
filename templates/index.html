<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <title>MyPath | Career Navigator</title>
    
    <style>
        :root {
            --primary: #0077b6; /* Deep Ocean */
            --primary-hover: #023e8a;
            --background-color: #e0f7fa; /* Pale Mint/Water */
            --form-bg: #ffffff;
            --mint-glow: #b2f2bb;
        }

        body {
            /* This creates a soft 'underwater' gradient */
            background: linear-gradient(180deg, #ffffff 0%, #e0f7fa 100%);
            color: #023e8a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, sans-serif;
        }

        main.container {
            max-width: 650px;
            background: var(--form-bg);
            padding: 2.5rem;
            border-radius: 30px; /* Fun, bubbly corners */
            box-shadow: 0 20px 40px rgba(0, 119, 182, 0.1);
            border: 2px solid #ffffff;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--primary);
            text-align: center;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        .subtitle {
            text-align: center;
            font-weight: 500;
            color: #00b4d8;
            margin-bottom: 2rem;
        }

        /* The 'Oceanic' Inputs */
        textarea, input, select {
            background-color: #f0f9ff !important;
            border: 2px solid #e0f2fe !important;
            border-radius: 15px !important;
            color: #023e8a !important;
        }

        textarea:focus, input:focus, select:focus {
            border-color: #00b4d8 !important;
            box-shadow: 0 0 0 4px rgba(0, 180, 216, 0.15) !important;
        }

        /* The Wave Button */
        button {
            border: none;
            background: linear-gradient(135deg, #0077b6 0%, #00b4d8 100%);
            border-radius: 50px; /* Pill shape */
            padding: 0.8rem 2rem;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(0, 119, 182, 0.3);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 119, 182, 0.4);
        }

        #output {
            background: #fdfdfd;
            border: 2px dashed #00b4d8;
            border-radius: 20px;
            padding: 1.5rem;
            color: #1e3a8a;
        }

        /* Soft Mint Badge */
        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: #d1fae5;
            color: #065f46;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <main class="container">
        
        <header>
            <div style="text-align: center;"><span class="badge">Matric & Beyond</span></div>
            <h1>MyPath</h1>
            <p class="subtitle">Where will your waves take you?</p>
        </header>

        <section id="form-section">
            <label for="subjects">What did you study? </label>
            <textarea id="subjects" rows="3" placeholder="e.g. Maths 55%, English 70%, Physics 40%"></textarea>

            <label for="interests">What makes you come alive? </label>
            <input type="text" id="interests" placeholder="e.g. Solving puzzles, tech, helping animals">

            <label for="goal">Choose your current vibe </label>
            <select id="goal">
                <option value="money">💎 The High Life (Wealth)</option>
                <option value="passion">🌊 The Flow (Passion)</option>
                <option value="stable">⚓ The Anchor (Security)</option>
            </select>

            <button onclick="sendData()">Explore My Paths</button>
        </section>

        <section id="result-section" style="display:none;">
            <article>
                <header>
                    <h3 id="res-title" style="margin:0; color:var(--primary);">Diving into the data...</h3>
                </header>
                <div id="output">
                    </div>
                <footer style="text-align: center; border:none; background:transparent;">
                    <button class="secondary outline" style="border-radius: 50px;" onclick="location.reload()">Try a Different Current</button>
                </footer>
            </article>
        </section>
    </main>

    <script>
        async function sendData() {
            const subjects = document.getElementById('subjects').value;
            const interests = document.getElementById('interests').value;
            const goal = document.getElementById('goal').value;

            if(!subjects || !interests) {
                alert("Give us some info so we can guide you!");
                return;
            }

            document.getElementById('form-section').style.display = 'none';
            document.getElementById('result-section').style.display = 'block';

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({subjects, interests, goal})
                });
                
                const result = await response.json();
                document.getElementById('res-title').innerText = "Your Career Map 🗺️";
                document.getElementById('output').innerText = result.message;
            } catch (error) {
                document.getElementById('output').innerText = "Looks like a wipeout. Refresh and try again!";
            }
        }
    </script>
</body>
</html>
