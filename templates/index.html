<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <title>MyPath | Career Navigator</title>
    
    <style>
        :root {
            --primary: #0077b6;
            --background-color: #f0fdfa;
        }

        body {
            background: linear-gradient(180deg, #ffffff 0%, #e0f7fa 100%);
            color: #023e8a;
            min-height: 100vh;
            display: flex;
            flex-direction: column; /* Stack vertically */
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }

        main.container {
            max-width: 650px;
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 119, 182, 0.1);
            width: 100%;
        }

        h1 { font-size: 2.5rem; color: var(--primary); text-align: center; margin-bottom: 0.5rem; }
        .subtitle { text-align: center; color: #00b4d8; margin-bottom: 2rem; font-weight: 500; }

        textarea, input, select {
            background-color: #f0f9ff !important;
            border: 2px solid #e0f2fe !important;
            border-radius: 15px !important;
        }

        button {
            border: none;
            background: linear-gradient(135deg, #0077b6 0%, #00b4d8 100%);
            border-radius: 50px;
            padding: 0.8rem 2rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,119,182,0.3); }

        #output {
            background: #fdfdfd;
            border: 2px dashed #00b4d8;
            border-radius: 20px;
            padding: 1.5rem;
            margin-top: 1rem;
        }

        .badge {
            display: block;
            width: fit-content;
            margin: 0 auto 1rem auto;
            padding: 4px 12px;
            background: #d1fae5;
            color: #065f46;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        /* --- BURSARY SECTION --- */
        .bursary-alert-box {
            max-width: 650px;
            width: 100%;
            margin-top: 30px;
            background: white;
            padding: 25px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #e0f2fe;
        }

        .bursary-alert-box h4 {
            margin-bottom: 10px;
            color: var(--primary);
        }

        .bursary-alert-box p {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 20px;
        }

        .alert-btn {
            background: #2a9d8f !important; /* Greenish teal for action */
            color: white !important;
            text-decoration: none;
            display: inline-block;
            border-radius: 50px;
            padding: 10px 30px;
            font-weight: bold;
            transition: 0.3s;
        }

        .alert-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .spinner {
            display: inline-block;
            width: 1.2rem;
            height: 1.2rem;
            border: 3px solid rgba(0, 119, 182, 0.2);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <main class="container">
        <header>
            <span class="badge">Matric & Beyond</span>
            <h1>MyPath</h1>
            <p class="subtitle">Where will your waves take you?</p>
        </header>

        <section id="form-section">
            <label for="subjects">Subjects & Marks </label>
            <textarea id="subjects" rows="3" placeholder="e.g. Maths 50%, English 65%, Physics 45%"></textarea>

            <label for="interests">What makes you come alive? </label>
            <input type="text" id="interests" placeholder="e.g. Fixing things, creative writing, helping people">

            <label for="goal">Your current vibe </label>
            <select id="goal">
                <option value="money">💎 The High Life (Wealth)</option>
                <option value="passion">🌊 The Flow (Passion)</option>
                <option value="stable">⚓ The Anchor (Security)</option>
            </select>

            <button id="submit-btn" onclick="sendData()">Explore My Paths</button>
        </section>

        <section id="result-section" style="display:none;">
            <article>
                <header>
                    <h3 id="res-title" style="margin:0; color:var(--primary);">
                        Mapping the currents... <span id="ocean-spinner" class="spinner"></span>
                    </h3>
                </header>
                <div id="output"></div>
                <footer style="text-align: center; border:none; background:transparent;">
                    <button class="secondary outline" style="border-radius: 50px;" onclick="location.reload()">New Search</button>
                </footer>
            </article>
        </section>
    </main>

    <div class="bursary-alert-box">
        <h4>🎓 Don't Miss Out on 2026 Bursaries</h4>
        <p>NSFAS, Funza, and private bursaries open soon. Get notified immediately so you can apply first.</p>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLScLt6L15P9FK9upfu6ChIR5FSrvMPtoXuQU1WICJI7gI-6U6Q/viewform?usp=header" target="_blank" class="alert-btn">Get Bursary Alerts</a>
    </div>

    <script>
        async function sendData() {
            const subjects = document.getElementById('subjects').value;
            const interests = document.getElementById('interests').value;
            const goal = document.getElementById('goal').value;

            if(!subjects || !interests) {
                alert("Please fill in your details.");
                return;
            }

            document.getElementById('form-section').style.display = 'none';
            document.getElementById('result-section').style.display = 'block';
            
            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({subjects, interests, goal})
                });
                
                const result = await response.json();
                
                document.getElementById('ocean-spinner').style.display = 'none';
                document.getElementById('res-title').innerText = "Your Personalized Map 🗺️";
                document.getElementById('output').innerHTML = marked.parse(result.message);
            } catch (error) {
                document.getElementById('ocean-spinner').style.display = 'none';
                document.getElementById('output').innerText = "Wipeout! Please try again.";
            }
        }
    </script>
</body>
</html>
